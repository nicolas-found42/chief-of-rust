# Local build defaults. Keep incremental on for dev; opt into sccache in CI
# by setting RUSTC_WRAPPER=sccache (requires incremental = false there).
[build]
incremental = true

# Use the bundled rust-lld where available; mold is faster on Linux but must
# be installed, so it is left as an opt-in via .cargo/config.local.toml.
# [target.x86_64-unknown-linux-gnu]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]
