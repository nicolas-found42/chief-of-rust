[workspace]
resolver = "3"
members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# Local development and test builds trade debug fidelity for link time: line
# tables are enough for backtraces, packed debug info cuts the payload the
# linker writes, and 256 codegen units keep incremental rebuilds parallel.
# Dependencies stay at opt-level 2 and build scripts at 3 so their code is not
# pessimized. Only `dev` and `test` are affected — `release` below keeps its
# existing settings, so the image CI builds measures what production ships.
[profile.dev]
opt-level = 1
debug = "line-tables-only"
# `unpacked` leaves line tables in object files next to the binary instead of
# running dsymutil per linked binary: dsymutil after every one of the ~25 test
# binary links dominated the edit-to-green path, and `packed` bought nothing
# at opt-level 1 with line tables only. `release` keeps `strip = "symbols"`.
split-debuginfo = "unpacked"
incremental = true
codegen-units = 256

[profile.dev.package."*"]
opt-level = 2
# Dependencies are rlibs: `packed` keeps their per-CGU objects out of
# `target/debug/deps` (an unpacked dep tree added ~12k directory entries that
# taxed every test-process spawn) and never runs dsymutil, because dsymutil
# only runs at final links. The workspace crate stays `unpacked` above.
split-debuginfo = "packed"

[profile.dev.build-override]
opt-level = 3

[profile.test]
inherits = "dev"

# Trim the release binary: unstripped it shipped ~150 MB in the runtime
# image (walking skeleton, issue #2), mostly rustls/rig symbol tables.
[profile.release]
strip = "symbols"
