# nextest configuration. See https://nexte.st/docs/configuration/
[profile.default]
retries = 0
fail-fast = false
# The slowest legitimate test is the GDELT Retry-After bound (~20 s of real
# sleeps); anything past a minute is a hang, not a slow test.
slow-timeout = { period = "60s", terminate-after = 2 }

# CI keeps going after a failure and leaves a machine-readable report.
[profile.ci]
fail-fast = false
junit = { path = "junit.xml" }
