[package]
name = "chief-of-rust"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
async-trait = "0.1.92"
axum = "0.8.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", features = ["json", "form", "query", "rustls"] }
url = "2"
scraper = "0.24"
base64 = "0.22"
chrono-tz = "0.10"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal", "fs", "net", "sync", "process", "io-std", "io-util"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sha2 = "0.10"
flate2 = "1.1.10"
jsonschema = { version = "0.58.6", default-features = false }

pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }

[dev-dependencies]
axum-test = "22.0.0-rc.1"
tempfile = "3.27.0"
wiremock = "0.6.5"
