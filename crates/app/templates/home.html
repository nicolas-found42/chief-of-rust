<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>chief-of-rust</title>
  <script src="/static/htmx.min.js" defer></script>
  <style>
    body {
      font-family: sans-serif;
      max-width: 40rem;
      margin: 2rem auto;
    }

    section {
      margin: 1.5rem 0;
    }

    blockquote {
      border-left: 3px solid #999;
      padding-left: 0.75rem;
    }
  </style>
</head>

<body>
  <h1>{{ banner }}</h1>
  <section id="status">
    <p>LLM provider: <strong>{{ llm_name }}</strong></p>
    <p>Google: {{ google_state }}</p>
    <p>Background ticks: {{ tick_count }}{% match last_tick_text %}{% when Some with (text) %}, last {{ text }}{% when
      None %}{% endmatch %}</p>
  </section>
  <section>
    <h2>Ask the model</h2>
    <form hx-post="/llm" hx-target="#reply" hx-swap="outerHTML">
      <input name="prompt" placeholder="Say something…" required>
      <button type="submit">Send</button>
    </form>
    {% include "reply.html" %}
  </section>
</body>

</html>
