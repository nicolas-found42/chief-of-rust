services:
  app:
    build: .
    # The walking skeleton (issue #2) serves SSR on loopback only. The
    # installed-flow receiver port is mapped because Google redirects the
    # user's browser to 127.0.0.1:4319 on the host.
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4319:4319"
    environment:
      WORKSPACE_DIR: /data/workspace
      LLM_PROVIDER: mock
    volumes:
      - ./workspace:/data/workspace:Z
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4317/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
  searxng:
    # Self-hosted metasearch kept from the TypeScript era: infrastructure, not
    # TypeScript (issue #8). The 127.0.0.1 bind is load-bearing — SearXNG has
    # no authentication of its own, so it must not be reachable from the
    # network.
    image: docker.io/searxng/searxng:latest
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./searxng:/etc/searxng:Z
  valkey:
    # SearXNG's limiter and rate limiter store; required by the official
    # compose template even when only the app's own calls hit the instance.
    image: docker.io/valkey/valkey:9-alpine
