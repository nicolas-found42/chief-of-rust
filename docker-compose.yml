name: chief-of-rust
services:
  app:
    build: .
    ports:
      - "127.0.0.1:5317:5317"
    environment:
      PORT: 5317
      BIND_ADDR: 0.0.0.0
      WORKSPACE_DIR: /data/workspace
      LLM_PROVIDER: ${LLM_PROVIDER:-mistral}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ASANA_ACCESS_TOKEN: ${ASANA_ACCESS_TOKEN:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      HUBSPOT_ACCESS_TOKEN: ${HUBSPOT_ACCESS_TOKEN:-}
      SEARXNG_BASE_URL: http://searxng:8080
    depends_on:
      - searxng
    volumes:
      - workspace:/data/workspace
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5317/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
  searxng:
    image: docker.io/searxng/searxng@sha256:c7cc75852051bf6254afda6ed1b920dd1677d8efe4ab141bf558f02e582f4371
    volumes:
      - ./searxng:/etc/searxng:ro
    depends_on:
      - valkey
    environment:
      SEARXNG_SETTINGS_PATH: /etc/searxng/settings.yml
    restart: "no"
  valkey:
    image: docker.io/valkey/valkey@sha256:a174b894902bd3367e330d47cc2054367dc4917701776aaf336f41d83b65ec7a
    restart: "no"
volumes:
  workspace:
