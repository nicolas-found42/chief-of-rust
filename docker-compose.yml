name: chief-of-rust
services:
  app:
    build: .
    ports:
      - "127.0.0.1:5317:5317"
    environment:
      PORT: 5317
      BIND_ADDR: 0.0.0.0
      WORKSPACE_DIR: /data/workspace
      TERMINAL_ARCHIVE_DIR: /data/terminal-archive
      TERMINAL_COLLECTION_SECONDS: ${TERMINAL_COLLECTION_SECONDS:-600}
      TERMINAL_REQUEST_SECONDS: ${TERMINAL_REQUEST_SECONDS:-600}
      TERMINAL_MAX_ROUNDS: ${TERMINAL_MAX_ROUNDS:-3}
      TERMINAL_MAX_SOURCES: ${TERMINAL_MAX_SOURCES:-80}
      LLM_PROVIDER: ${LLM_PROVIDER:-opencode}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-large-4}
      MISTRAL_REASONING_EFFORT: ${MISTRAL_REASONING_EFFORT:-none}
      MISTRAL_BASE_URL: ${MISTRAL_BASE_URL:-https://api.mistral.ai/v1}
      JEV_API_KEY: ${JEV_API_KEY:-}
      JEV_MODEL: ${JEV_MODEL:-typesafe/jev-1.14}
      JEV_BASE_URL: ${JEV_BASE_URL:-https://openrouter.ai/api}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-beam-free}
      OPENCODE_REASONING_EFFORT: ${OPENCODE_REASONING_EFFORT:-medium}
      OPENCODE_BASE_URL: ${OPENCODE_BASE_URL:-https://opencode.ai/inference/go/v1}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ZAI_MODEL: ${ZAI_MODEL:-glm-5.3-flash}
      ZAI_REASONING_EFFORT: ${ZAI_REASONING_EFFORT:-low}
      ZAI_BASE_URL: ${ZAI_BASE_URL:-https://api.z.ai/api/coding/paas/v4}
      OLLAMA_CLOUD_API_KEY: ${OLLAMA_CLOUD_API_KEY:-}
      OLLAMA_CLOUD_MODEL: ${OLLAMA_CLOUD_MODEL:-deepseek-v4.1-flash}
      OLLAMA_CLOUD_REASONING_EFFORT: ${OLLAMA_CLOUD_REASONING_EFFORT:-high}
      OLLAMA_CLOUD_BASE_URL: ${OLLAMA_CLOUD_BASE_URL:-https://ollama.com/v1}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      FIRECRAWL_BASE_URL: ${FIRECRAWL_BASE_URL:-https://api.firecrawl.dev/v2}
      MEETING_SEGMENT_CONCURRENCY: ${MEETING_SEGMENT_CONCURRENCY:-4}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ASANA_ACCESS_TOKEN: ${ASANA_ACCESS_TOKEN:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      HUBSPOT_ACCESS_TOKEN: ${HUBSPOT_ACCESS_TOKEN:-}
      SEARXNG_BASE_URL: http://searxng:8080
    depends_on:
      - searxng
    volumes:
      - workspace:/data/workspace
      - ./archive/terminal:/data/terminal-archive
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5317/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
  searxng:
    image: docker.io/searxng/searxng@sha256:c7cc75852051bf6254afda6ed1b920dd1677d8efe4ab141bf558f02e582f4371
    volumes:
      - ./searxng:/etc/searxng:ro
    depends_on:
      - valkey
    environment:
      SEARXNG_SETTINGS_PATH: /etc/searxng/settings.yml
    restart: "no"
  valkey:
    image: docker.io/valkey/valkey@sha256:a174b894902bd3367e330d47cc2054367dc4917701776aaf336f41d83b65ec7a
    restart: "no"
volumes:
  workspace:
